<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#176b5b">
    <title>You’re offline</title>
    <style>
      *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#f3bec03d,transparent 28rem),#eee5d7;color:#19322c;font:500 1rem/1.55 ui-rounded,system-ui,sans-serif;min-height:100svh;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}.frame{display:grid;width:min(100%,34rem);min-height:100svh;margin:auto;padding:1.125rem;place-items:center;background:#f8f3e9}.card{max-width:24rem;padding:1.5rem;border:1px solid #19322c12;border-radius:1.375rem;background:#fffdfa;box-shadow:0 .5rem 1.75rem #24362f14;text-align:center}.icon{display:grid;width:3rem;height:3rem;margin:0 auto 1rem;border-radius:1rem;background:#dbece4;color:#0f5549;font-size:1.4rem;place-items:center}h1{margin:0;font-size:1.5rem;line-height:1.2}p{margin:.75rem 0 1.25rem;color:#65736e}button{min-height:2.75rem;border:0;border-radius:.875rem;background:#176b5b;color:white;padding:.75rem 1.25rem;font:750 .9rem/1.4 inherit;cursor:pointer}button:focus-visible{outline:3px solid #287dcb;outline-offset:3px}
    </style>
  </head>
  <body>
    <main class="frame"><section class="card"><div class="icon" aria-hidden="true">⌂</div><h1>You’re offline</h1><p>Your shared home is safe in the cloud. Reconnect before making changes, then try again.</p><button type="button" onclick="location.reload()">Try again</button></section></main>
  </body>
</html>
